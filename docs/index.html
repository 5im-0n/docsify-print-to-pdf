<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Document</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '[Project]',
      repo: '',
      loadSidebar: true,
      maxLevel: 4,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search',
        noData: 'No results found',
        depth: 6,
        hideOtherSidebarContent: false
      },
      print: {
        tocTitle: 'Table of Contents',  // heading of the TOC page in the exported PDF
        // Cover image of the exported PDF — optional. If not set, no cover page is inserted.
        coverUrl: '_media/cover.jpg',
        // Back-cover image — optional. If not set, no back page is inserted.
        backUrl: '_media/back.jpg',
        // How chapters start in the exported PDF:
        //   'page'    (default) — every chapter starts on a new page
        //   'onePage'           — every chapter is scaled to fit on exactly one page
        //   'flow'              — no page break, chapters flow continuously
        chapterBreak: 'flow',
        // Keep h1-h6 headings with the block immediately after them. When the
        // next block does not fit, the heading moves to the following page too.
        keepHeadingsWithNext: true,
        // Long lists and tables always split between items/rows. Optionally
        // repeat a table's header on every continuation page (default: false).
        repeatTableHeaders: false
      }
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1"></script>
  <!-- Docsify search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <!-- Markdown renderer used by the Print-to-PDF export -->
  <script src="//cdn.jsdelivr.net/npm/markdown-it@13/dist/markdown-it.min.js"></script>
  <!-- Print-to-PDF button: assembles cover + all chapters into a printable page -->
  <script src="docsify-print-to-pdf.js"></script>
</body>
</html>
